name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check JavaScript syntax
        run: for f in app.js historical-data.js pwa.js service-worker.js; do node --check "$f"; done

      - name: Compile Python script
        run: python3 -m py_compile rehost_etf.py

      - name: Run self-test of the calculation core
        run: node tools/check_math.mjs
